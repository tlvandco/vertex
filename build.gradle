plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm'
}

group = 'com.vertex.projects'
version = '2.0.0'
description = 'VERTEX - Enterprise Project Management Platform'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.3'
}

dependencies {
    // Core Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'          // REST API [web:199]
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'     // JPA/Hibernate [web:199]
    implementation 'org.springframework.boot:spring-boot-starter-security'     // Spring Security [web:199]
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // Bean Validation [web:199]
    implementation 'org.springframework.boot:spring-boot-starter-websocket'    // WebSocket/STOMP [web:199]
    implementation 'org.springframework.boot:spring-boot-starter-actuator'     // Health/metrics [web:199]
    implementation 'org.springframework.boot:spring-boot-starter-mail'         // SMTP email [web:199]
    implementation 'org.springframework.boot:spring-boot-starter-aop'          // AOP [web:199]
    implementation 'com.mysql:mysql-connector-j'
    implementation 'com.github.librepdf:openpdf:1.3.30'



    // JWT (scopes per JJWT guidance: api is implementation, impl/jackson are runtimeOnly)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // or jjwt-gson if you prefer

    // Databases

    runtimeOnly 'com.mysql:mysql-connector-j'                                  // MySQL driver [web:200]
    runtimeOnly 'com.h2database:h2'                                            // Local/testing DB [web:200]

    // Lombok
    compileOnly 'org.projectlombok:lombok'                                     // Annotations at compile [web:199]
    annotationProcessor 'org.projectlombok:lombok'                             // Annotation processing [web:199]
    testCompileOnly 'org.projectlombok:lombok'                                 // Tests (optional) [web:199]
    testAnnotationProcessor 'org.projectlombok:lombok'                         // Tests (optional) [web:199]

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'     // JUnit + Spring Test [web:199]
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"               // JUnit platform launcher [web:199]
}

tasks.named('test') {
    useJUnitPlatform()
}
