<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register — VERTEX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F4D03F;
            --dark: #1A1A1A;
            --glass: rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0a;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-field:focus {
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        .floating-label {
            position: absolute;
            left: 16px;
            top: 12px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-field:focus~.floating-label,
        .input-field:not(:placeholder-shown)~.floating-label {
            top: -22px;
            left: 4px;
            font-size: 0.7rem;
            color: var(--gold);
            font-weight: 600;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold) 0%, #B8860B 100%);
            color: #1a1a1a;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            z-index: 1;
        }

        .btn-gold::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
            z-index: -1;
        }

        .btn-gold:hover::after {
            left: 100%;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            filter: brightness(1.1);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 14px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: var(--gold);
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(26, 26, 26, 0.3);
            border-top-color: #1a1a1a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 relative">

    <!-- Ambient Background -->
    <div class="fixed inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&q=80" class="w-full h-full object-cover opacity-30 grayscale">
        <div class="absolute inset-0 bg-gradient-to-tr from-black via-transparent to-black"></div>
    </div>

    <div class="glass-card w-full max-w-md p-10 rounded-2xl relative z-10 animate-fade-in">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-serif font-bold text-white mb-2 tracking-tight">Elegance Awaits</h1>
            <p class="text-gray-400 text-sm tracking-widest uppercase">VERTEX</p>
        </div>

        <form onsubmit="handleRegister(event)" class="space-y-6">
            <div class="input-group">
                <input id="name" type="text" class="input-field" placeholder=" " required>
                <label class="floating-label">Full Name</label>
            </div>

            <div class="input-group">
                <input id="email" type="email" class="input-field" placeholder=" " required>
                <label class="floating-label">Email Address</label>
            </div>

            <div class="input-group">
                <input id="phone" type="tel" class="input-field" placeholder=" " required>
                <label class="floating-label">Phone Number</label>
            </div>

            <div class="input-group">
                <input id="password" type="password" class="input-field pr-12" placeholder=" " required>
                <label class="floating-label">Create Password</label>
                <span class="password-toggle" onclick="togglePassword('password')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </span>
            </div>

            <div class="input-group">
                <input id="confirmPassword" type="password" class="input-field pr-12" placeholder=" " required>
                <label class="floating-label">Confirm Password</label>
                <span class="password-toggle" onclick="togglePassword('confirmPassword')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </span>
            </div>

            <button id="submitBtn" type="submit" class="w-full py-4 btn-gold rounded-xl font-bold text-sm tracking-[0.2em] shadow-2xl uppercase transition-all flex items-center justify-center">
                <span id="btnText">Initialize Account</span>
                <div id="btnSpinner" class="spinner"></div>
            </button>

            <div class="text-center pt-4">
                <p class="text-gray-500 text-sm">
                    Member already? 
                    <a href="login.html" class="text-[var(--gold)] font-semibold hover:underline decoration-1 underline-offset-4 ml-1">Sign In</a>
                </p>
            </div>
        </form>
    </div>

    <script src="js/app.js"></script>
    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            if (password !== confirmPassword) {
                return APP.toast.error("Passwords do not match");
            }

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: password
            };

            // Loading state
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                const res = await APP.api.request('/auth/register', {
                    method: 'POST', body: JSON.stringify(payload)
                });

                if (res.success === false) throw new Error(res.message);

                APP.toast.success("Elegance awaits. Check your email for authentication.");
                setTimeout(() => location.href = `verify-otp.html?email=${payload.email}`, 2000);

            } catch (err) {
                APP.toast.error(err.message || 'Registration failed');
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>

</html>
