<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Verify OTP — Anantha Design Group</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&q=80"
            class="w-full h-full object-cover opacity-40">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-black/40"></div>
    </div>

    <div
        class="card w-full max-w-sm bg-black/40 backdrop-blur-xl border border-white/10 p-8 relative z-10 shadow-2xl animate-fade-in text-center">
        <div class="mb-8">
            <h2 class="text-2xl font-serif font-bold text-[var(--gold)] mb-2">Verify Code</h2>
            <p class="text-gray-300 text-sm">Enter the code sent to your email</p>
        </div>

        <div class="space-y-6">
            <input id="otp" type="text" maxlength="6"
                class="w-full p-4 text-center text-2xl tracking-[0.5em] font-mono bg-white/5 border border-white/10 rounded-lg text-white focus:border-[var(--gold)] focus:ring-1 focus:ring-[var(--gold)] outline-none transition-all"
                placeholder="------" autofocus>

            <button onclick="verifyOtp()"
                class="w-full py-3 btn-gold rounded-lg font-bold text-sm tracking-wide shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all">
                VERIFY
            </button>

            <button onclick="resendOtp()"
                class="text-sm text-gray-400 hover:text-[var(--gold)] transition-colors underline">
                Resend Code
            </button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const email = new URLSearchParams(location.search).get('email');
        if (!email) {
            APP.toast.error("No email specified");
            setTimeout(() => location.href = 'login.html', 2000);
        }

        async function verifyOtp() {
            const otp = document.getElementById('otp').value;
            if (otp.length < 6) return APP.toast.error("Enter 6-digit code");

            try {
                const data = await APP.api.request('/auth/verify-otp', {
                    method: 'POST',
                    body: JSON.stringify({ email, otp })
                });

                if (data.success === false) throw new Error(data.message);

                APP.auth.login(data.token, data.user.role, data.user.email);

                APP.toast.success("Verified! Redirecting...");
                setTimeout(() => {
                    // Redirect based on role
                    if (data.user.role === 'ADMIN') location.href = 'admin-dashboard.html';
                    else if (data.user.role === 'USER' || data.user.role === 'PROJECT_MANAGER' || data.user.role === 'ARCHITECT') location.href = 'user-dashboard.html'; // Adjust for staff roles
                    else location.href = 'client-dashboard.html';
                }, 1000);

            } catch (e) {
                APP.toast.error(e.message || "Invalid OTP");
            }
        }

        async function resendOtp() {
            try {
                await APP.api.request('/auth/send-otp', {
                    method: 'POST', body: JSON.stringify({ email })
                });
                APP.toast.success("Code resent");
            } catch (e) { APP.toast.error("Failed to resend"); }
        }
    </script>
</body>

</html>
