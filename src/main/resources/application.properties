# ---------------------------
# Server & application
# ---------------------------
server.port=${PORT:8080}
spring.application.name=vertex-projects-backend

# ---------------------------
# Datasource (MySQL)
# ---------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vertex_projects?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:Pinkink@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------
# HikariCP (connection pool)
# ---------------------------
spring.datasource.hikari.pool-name=VertexHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ---------------------------
# JPA / Hibernate
# ---------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------------------------
# JWT (Security)
# ---------------------------
jwt.secret=${JWT_SECRET:VERTEX-ENTERPRISE-SECRET-KEY-FOR-JWT-TOKEN-OPERATIONS-MIN-512-BITS-64-BYTES-LENGTH-REQUIRED-FOR-HS512-ALGORITHM}
jwt.expiration=${JWT_EXP_MS:86400000}

# ---------------------------
# Mail (Gmail SMTP)
# ---------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lalithvarma99@gmail.com
spring.mail.password=ujlfdzbcvpszrdzy
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=true

# ---------------------------
# CORS (property-based global)
# Note: You also have explicit CorsConfig; keep these for env overrides.
# ---------------------------
spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8000,http://127.0.0.1:5500}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.exposed-headers=Authorization

# ---------------------------
# Multipart uploads
# ---------------------------
spring.web.resources.static-locations=file:uploads/,classpath:/static/
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---------------------------
# HTTP response compression
# ---------------------------
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ---------------------------
# Logging
# ---------------------------
logging.level.com.vertex.projects=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/application.log

# ---------------------------
# Actuator (optional)
# ---------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

